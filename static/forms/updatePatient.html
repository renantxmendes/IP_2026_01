<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Atualizar Paciente</title>
</head>
<body>
  <h1>Atualizar Paciente</h1>

  <form action="/updatePatient" method="POST">
    <label>ID do paciente:</label><br>
    <input type="number" name="id" required><br><br>

    <label>Novo nome:</label><br>
    <input type="text" name="nome" required><br><br>

    <label>Novo CPF:</label><br>
    <input type="text" name="cpf" required><br><br>

    <label>Novo email:</label><br>
    <input type="email" name="email"><br><br>

    <label>Novo telefone:</label><br>
    <input type="text" name="telefone"><br><br>

    <label>Nova data de nascimento:</label><br>
    <input type="date" name="data_nascimento" required><br><br>

    <label>Novo endereço:</label><br>
    <input type="text" name="endereco"><br><br>

    <label>Novo tipo sanguíneo:</label><br>
    <select name="tipo_sanguineo">
      <option value="">Selecione</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
    </select><br><br>

    <button type="submit">Atualizar</button>
  </form>

  <br>
  <a href="/">Voltar para o início</a>
</body>
</html>
